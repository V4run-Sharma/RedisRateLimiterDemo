spring.application.name=RedisRateLimiterDemo

# Separate the demo's Redis keys from anything else in the same Redis.
ratelimiter.redis-key-prefix=demo

# Trust X-Forwarded-For from internal proxies (localhost included), so verify.sh can
# simulate different client IPs. In production, only your own proxies should be trusted.
server.forward-headers-strategy=native

management.endpoints.web.exposure.include=health,metrics

# Show the reason in error responses (for example why a USER limit failed).
server.error.include-message=always

# Fail fast when Redis is unreachable, so the outage check doesn't wait the default 60s.
spring.data.redis.timeout=2s
